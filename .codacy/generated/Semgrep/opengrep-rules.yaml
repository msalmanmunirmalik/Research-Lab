          - pattern: openai.Completion.create(...)
          - pattern: openai.chat.completions.create(...)
          - pattern: openai.responses.create(...)
          - pattern: openai.embeddings.create(...)
          - pattern: openai.images.generate(...)
          - pattern: openai.audio.transcriptions.create(...)
          - pattern: openai.audio.speech.create(...)
  - id: codacy.python.openai.non-guardrails-client-usage
    message: OpenAI client used without Guardrails. Replace with GuardrailsOpenAI /
      GuardrailsAsyncOpenAI.
    severity: WARNING
    languages:
      - python
    metadata:
      category: security
      cwe: "CWE-20: Improper Input Validation"
      references:
        - https://openai.github.io/openai-guardrails-python/
      justification: >
        Guardrails advises using GuardrailsOpenAI/GuardrailsAsyncOpenAI as a
        drop-in replacement so validation runs automatically on every API call.
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: |
              $C = OpenAI(...)
              ...
              $C.chat.completions.create(...)
          - pattern: |
              $C = OpenAI(...)
              ...
              $C.responses.create(...)
          - pattern: |
              $C = OpenAI(...)
              ...
              $C.embeddings.create(...)
          - pattern: |
              $C = AsyncOpenAI(...)
              ...
              $C.chat.completions.create(...)
          - pattern: |
              $C = AsyncOpenAI(...)
              ...
              $C.responses.create(...)
          - pattern: |
              $C = AsyncOpenAI(...)
              ...
              $C.embeddings.create(...)
      - pattern-not: |
          $C = GuardrailsOpenAI(...)
      - pattern-not: |
          $C = GuardrailsAsyncOpenAI(...)
  - id: codacy.python.openai.import-without-guardrails
    message: OpenAI SDK imported without Guardrails import. Consider
