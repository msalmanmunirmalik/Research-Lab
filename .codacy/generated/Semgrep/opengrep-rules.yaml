          - pattern: $EVENT
    pattern-sinks:
      - patterns:
          - focus-metavariable: $QUERY
          - pattern-either:
              - pattern: $KNEX.fromRaw($QUERY, ...)
              - pattern: $KNEX.whereRaw($QUERY, ...)
              - pattern: $KNEX.raw($QUERY, ...)
          - pattern-either:
              - pattern-inside: |
